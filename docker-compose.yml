services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- n8n lui-même ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${TZ:-Africa/Dakar}
      TZ: ${TZ:-Africa/Dakar}
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Les workflows lisent leur configuration via $env
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Dossier lisible par les nœuds "Read file" (profil + CV)
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      # Le workflow de validation tourne chaque minute : on purge l'historique
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      # --- Configuration de l'agent (voir .env) ---
      CANDIDATE_NAME: ${CANDIDATE_NAME}
      CANDIDATE_EMAIL: ${CANDIDATE_EMAIL}
      SEARCH_KEYWORDS: ${SEARCH_KEYWORDS}
      EXCLUDE_KEYWORDS: ${EXCLUDE_KEYWORDS:-}
      MAX_AGE_DAYS: ${MAX_AGE_DAYS:-14}
      MAX_OFFERS_PER_RUN: ${MAX_OFFERS_PER_RUN:-15}
      MIN_SCORE: ${MIN_SCORE:-70}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      # Surchargés uniquement par docker-compose.test.yml (faux serveurs)
      ANTHROPIC_API_URL: ${ANTHROPIC_API_URL:-https://api.anthropic.com}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-https://api.telegram.org}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./profile:/files/profile:ro
      - ./workflows:/import/workflows:ro
      - ./.import:/import/secrets:ro

volumes:
  pg_data:
  n8n_data:
